AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Relay: Salesforce Closed Won deals -> SQS -> idempotent writes into a mock
  ERP on DynamoDB. Everything is event-driven (EventBridge Scheduler and SQS);
  no VPC, no NAT gateway, nothing billed by the hour.

Parameters:
  SalesforceLoginUrl:
    Type: String
    Description: The org's My Domain URL, e.g. https://xxx-dev-ed.develop.my.salesforce.com
    AllowedPattern: ^https://.+
  SalesforceClientId:
    Type: String
    Description: External Client App consumer key (the secret is a SecureString created by hand)
  SalesforceApiVersion:
    Type: String
    Default: v66.0
  PollerState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: The pause switch. DISABLED stops the 2-minute poll schedule.
  ParamPrefix:
    Type: String
    Default: /relay
    AllowedPattern: ^/[A-Za-z0-9_/-]+$
  AlertEmail:
    Type: String
    Default: ""
    Description: >
      Where alarms are emailed. Passed at deploy time (never committed). AWS
      sends a confirmation email; click it within 48 hours or no alert arrives.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Globals:
  Function:
    Architectures: [x86_64]
    MemorySize: 256
    Environment:
      Variables:
        RELAY_PARAM_PREFIX: !Ref ParamPrefix
        CUSTOMERS_TABLE: !Ref CustomersTable
        ORDERS_TABLE: !Ref OrdersTable
        INVOICES_TABLE: !Ref InvoicesTable

Resources:
  # ---- queues ------------------------------------------------------------------

  EventsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      # Longer than the main queue: a standard queue keeps a message's original
      # enqueue time when it moves to the DLQ, so equal retention could expire it early.
      MessageRetentionPeriod: 1209600 # 14 days

  EventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      # At least 6x the worker's timeout (AWS guidance for SQS-triggered Lambdas).
      # The worker overrides it per message for its retry backoff.
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600 # 4 days
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EventsDLQ.Arn
        maxReceiveCount: 5

  # ---- the mock ERP ----------------------------------------------------------------
  # Provisioned 5/5 each: 15 of the 25 always-free RCU/WCU. On-demand is not
  # in the always-free tier. Throttling under a burst is classified transient.

  CustomersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PROVISIONED
      ProvisionedThroughput: {ReadCapacityUnits: 5, WriteCapacityUnits: 5}
      AttributeDefinitions: [{AttributeName: customer_id, AttributeType: S}]
      KeySchema: [{AttributeName: customer_id, KeyType: HASH}]

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PROVISIONED
      ProvisionedThroughput: {ReadCapacityUnits: 5, WriteCapacityUnits: 5}
      AttributeDefinitions: [{AttributeName: order_id, AttributeType: S}]
      KeySchema: [{AttributeName: order_id, KeyType: HASH}]

  InvoicesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PROVISIONED
      ProvisionedThroughput: {ReadCapacityUnits: 5, WriteCapacityUnits: 5}
      AttributeDefinitions: [{AttributeName: invoice_id, AttributeType: S}]
      KeySchema: [{AttributeName: invoice_id, KeyType: HASH}]

  # ---- configuration ------------------------------------------------------------------
  # Non-secret Salesforce settings. The client secret is a SecureString you
  # create by hand (CloudFormation can't create SecureStrings), and the
  # watermark and chaos flags are written at runtime, so none of those are
  # owned by this stack: a redeploy can never reset them.

  SalesforceLoginUrlParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub ${ParamPrefix}/salesforce/login_url
      Type: String
      Value: !Ref SalesforceLoginUrl

  SalesforceClientIdParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub ${ParamPrefix}/salesforce/client_id
      Type: String
      Value: !Ref SalesforceClientId

  SalesforceApiVersionParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub ${ParamPrefix}/salesforce/api_version
      Type: String
      Value: !Ref SalesforceApiVersion

  # ---- log groups: 7-day retention on every one ------------------------------------------
  # Named outside /aws/lambda/ and wired in through LoggingConfig, so Lambda
  # never auto-creates a never-expiring group that races the stack.

  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /relay/${AWS::StackName}/ingest
      RetentionInDays: 7

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /relay/${AWS::StackName}/worker
      RetentionInDays: 7

  ReconcilerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /relay/${AWS::StackName}/reconciler
      RetentionInDays: 7

  # ---- functions ------------------------------------------------------------------------

  IngestFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: ingest/Dockerfile
      DockerContext: .
      DockerTag: ingest
    Properties:
      PackageType: Image
      Description: Polls Salesforce for changed Closed Won deals and publishes them to SQS
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref IngestLogGroup
        LogFormat: Text
      Environment:
        Variables:
          QUEUE_URL: !Ref EventsQueue
          INGEST_LAG_SECONDS: "120"
      # Scheduler invokes asynchronously. With retries, a failing run would
      # overlap the next scheduled one; the next tick is the retry instead.
      EventInvokeConfig:
        MaximumRetryAttempts: 0
        MaximumEventAgeInSeconds: 60
      Policies:
        - Statement:
            - Sid: SalesforceSettings
              Effect: Allow
              Action: [ssm:GetParameter, ssm:GetParameters]
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParamPrefix}/salesforce/*
            - Sid: Watermark
              Effect: Allow
              Action: [ssm:GetParameter, ssm:PutParameter]
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParamPrefix}/ingest/watermark
            - Sid: DecryptSecretViaSsm
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
        - SQSSendMessagePolicy:
            QueueName: !GetAtt EventsQueue.QueueName
      Events:
        Poll:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(2 minutes)
            State: !Ref PollerState
            FlexibleTimeWindow: {Mode: "OFF"}
            RetryPolicy:
              MaximumRetryAttempts: 0
              MaximumEventAgeInSeconds: 60
            Input: "{}"

  WorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: worker/Dockerfile
      DockerContext: .
      DockerTag: worker
    Properties:
      PackageType: Image
      Description: Validates each event and writes it to the ERP idempotently
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref WorkerLogGroup
        LogFormat: Text
      Environment:
        Variables:
          DLQ_NAME: !GetAtt EventsDLQ.QueueName
          BACKOFF_BASE_SECONDS: "60"
          BACKOFF_CAP_SECONDS: "900"
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref CustomersTable}
        - DynamoDBCrudPolicy: {TableName: !Ref OrdersTable}
        - DynamoDBCrudPolicy: {TableName: !Ref InvoicesTable}
        - SQSSendMessagePolicy:
            QueueName: !GetAtt EventsDLQ.QueueName
        - Statement:
            - Sid: ChaosFlags
              Effect: Allow
              Action: ssm:GetParameters
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParamPrefix}/chaos/*
            - Sid: BackoffAndQueueLookup
              Effect: Allow
              Action: [sqs:ChangeMessageVisibility, sqs:GetQueueUrl]
              Resource: [!GetAtt EventsQueue.Arn, !GetAtt EventsDLQ.Arn]
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt EventsQueue.Arn
            BatchSize: 10
            # Without this, a normal return deletes the WHOLE batch, including
            # the records the worker reported as failed.
            FunctionResponseTypes: [ReportBatchItemFailures]
            # Caps concurrent writers to protect the ERP. Reserves no account
            # concurrency (new accounts have only 10, so reserving would fail).
            ScalingConfig:
              MaximumConcurrency: 2

  ReconcilerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: reconciler/Dockerfile
      DockerContext: .
      DockerTag: reconciler
    Properties:
      PackageType: Image
      Description: Nightly comparison of Salesforce and the ERP; re-enqueues what the poller missed
      Timeout: 300
      LoggingConfig:
        LogGroup: !Ref ReconcilerLogGroup
        LogFormat: Text
      Environment:
        Variables:
          QUEUE_NAME: !GetAtt EventsQueue.QueueName
          RECONCILE_GRACE_MINUTES: "10"
      Policies:
        - Statement:
            - Sid: SalesforceSettings
              Effect: Allow
              Action: [ssm:GetParameter, ssm:GetParameters]
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParamPrefix}/salesforce/*
            - Sid: DecryptSecretViaSsm
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
            - Sid: QueueLookup
              Effect: Allow
              Action: sqs:GetQueueUrl
              Resource: !GetAtt EventsQueue.Arn
        - DynamoDBReadPolicy: {TableName: !Ref OrdersTable}
        - SQSSendMessagePolicy:
            QueueName: !GetAtt EventsQueue.QueueName
      Events:
        Nightly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 2 * * ? *) # 02:00 UTC
            FlexibleTimeWindow: {Mode: "OFF"}
            RetryPolicy:
              MaximumRetryAttempts: 1
            Input: "{}"

  # ---- alerting ------------------------------------------------------------------------
  # Three alarms (the free tier allows 10), each notifying on ALARM and on OK.

  AlertTopic:
    Type: AWS::SNS::Topic

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # A human must look: something is in the DLQ. It stays red until the
  # message is handled (fix the deal in Salesforce, then `relayctl dlq ack`).
  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-dlq-not-empty
      AlarmDescription: Messages in the dead-letter queue. Run `relayctl dlq list`.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt EventsDLQ.QueueName}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # The worker is stuck. The threshold is above the ~15-minute retry budget,
  # so ordinary backoff never trips it.
  QueueStuckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-queue-stuck
      AlarmDescription: The oldest message has waited over 20 minutes; the worker isn't draining the queue.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{Name: QueueName, Value: !GetAtt EventsQueue.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1200
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # Three failed polls in 10 minutes (about three runs in a row): usually
  # Salesforce auth (an expired secret or a changed External Client App).
  IngestFailingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-ingest-failing
      AlarmDescription: The Salesforce poller keeps failing. Check the ingest logs for "poll failed".
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref IngestFunction}]
      Statistic: Sum
      Period: 600
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # ---- dashboard and the "trace one deal" query ----------------------------------------

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              {"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
               "properties": {"title": "Queue depth", "region": "${AWS::Region}", "stat": "Maximum", "period": 60,
                 "metrics": [["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${Queue}", {"label": "waiting"}],
                             [".", "ApproximateNumberOfMessagesNotVisible", ".", ".", {"label": "in flight / backing off"}],
                             [".", "ApproximateNumberOfMessagesVisible", ".", "${Dlq}", {"label": "dead-letter queue", "color": "#d62728"}]]}},
              {"type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
               "properties": {"title": "Sync outcomes (Relay)", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                 "metrics": [["Relay", "EventsPublished", "Service", "ingest"],
                             [".", "OrdersWritten", ".", "worker"],
                             [".", "DuplicatesSkipped", ".", "worker"],
                             [".", "StaleVersionsDropped", ".", "worker"],
                             [".", "TransientRetries", ".", "worker", {"color": "#ff7f0e"}],
                             [".", "DeadLettered", ".", "worker", {"color": "#d62728"}],
                             [".", "DriftFound", ".", "reconciler"]]}},
              {"type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
               "properties": {"title": "Lambda duration (p95, ms)", "region": "${AWS::Region}", "stat": "p95", "period": 300,
                 "metrics": [["AWS/Lambda", "Duration", "FunctionName", "${Ingest}"],
                             [".", ".", ".", "${Worker}"],
                             [".", ".", ".", "${Reconciler}"]]}},
              {"type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
               "properties": {"title": "Lambda errors and throttles", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                 "metrics": [["AWS/Lambda", "Errors", "FunctionName", "${Ingest}"],
                             [".", ".", ".", "${Worker}"],
                             [".", "Throttles", ".", "${Worker}"]]}},
              {"type": "alarm", "x": 0, "y": 12, "width": 24, "height": 3,
               "properties": {"title": "Alarms", "alarms": ["${DlqAlarm}", "${StuckAlarm}", "${IngestAlarm}"]}}
            ]
          }
        - Queue: !GetAtt EventsQueue.QueueName
          Dlq: !GetAtt EventsDLQ.QueueName
          Ingest: !Ref IngestFunction
          Worker: !Ref WorkerFunction
          Reconciler: !Ref ReconcilerFunction
          DlqAlarm: !GetAtt DeadLetterAlarm.Arn
          StuckAlarm: !GetAtt QueueStuckAlarm.Arn
          IngestAlarm: !GetAtt IngestFailingAlarm.Arn

  # Saved in CloudWatch > Logs Insights > Queries. Replace the ID with any
  # Opportunity ID to see that deal's whole journey, poll to ERP write.
  TraceDealQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub ${AWS::StackName}/trace-one-deal
      LogGroupNames: [!Ref IngestLogGroup, !Ref WorkerLogGroup, !Ref ReconcilerLogGroup]
      QueryString: |
        fields @timestamp, service, msg, event_key, reason, attempt, retry_in_s, kind
        | filter event_key like /006FAKE00000000004/ or opportunity_id = "006FAKE00000000004"
        | sort @timestamp asc
        | limit 200

Outputs:
  DashboardUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}
  AlertTopicArn:
    Value: !Ref AlertTopic
  QueueUrl:
    Value: !Ref EventsQueue
  DeadLetterQueueUrl:
    Value: !Ref EventsDLQ
  OrdersTableName:
    Value: !Ref OrdersTable
  InvoicesTableName:
    Value: !Ref InvoicesTable
  CustomersTableName:
    Value: !Ref CustomersTable
  IngestFunctionName:
    Value: !Ref IngestFunction
  WorkerFunctionName:
    Value: !Ref WorkerFunction
  ReconcilerFunctionName:
    Value: !Ref ReconcilerFunction
