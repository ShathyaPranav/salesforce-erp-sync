version: "2"

linters:
  default: standard   # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
  settings:
    misspell:
      locale: UK
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
  exclusions:
    presets: [std-error-handling]
    rules:
      # Test fakes build requests from test-controlled input.
      - path: _test\.go
        linters: [gosec, noctx]

formatters:
  enable:
    - gofmt
