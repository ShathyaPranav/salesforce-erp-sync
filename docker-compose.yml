# Relay's local stack. `docker compose up -d` gives you, with no AWS account:
#   localstack       SQS, DynamoDB and SSM on http://localhost:4566
#   fake-salesforce  OAuth + REST query API on http://localhost:8080
#   bootstrap        one-shot: creates queues, tables and parameters, then exits
#   ingest           the Go poller Lambda image          http://localhost:9001
#   worker           the Python sync worker Lambda image  http://localhost:9002
#   reconciler       the nightly reconciler Lambda image  http://localhost:9003
#   esm-pump         test harness: feeds the queue to the worker like Lambda would
#
# LocalStack is pinned to 4.14.0, the last community release that starts
# without a LocalStack account. Every newer image (2026.x, :latest) exits with
# "License activation failed" unless LOCALSTACK_AUTH_TOKEN is set.

name: relay

x-aws-local: &aws-local
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test        # LocalStack accepts any credentials
  AWS_SECRET_ACCESS_KEY: test

services:
  localstack:
    image: localstack/localstack:4.14.0
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: sqs,dynamodb,ssm
      EAGER_SERVICE_LOADING: "1"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 3s
      timeout: 3s
      retries: 40

  fake-salesforce:
    build:
      context: .
      dockerfile: fake_salesforce/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FAKE_SF_PAGE_SIZE: "2000"

  bootstrap:
    image: public.ecr.aws/lambda/python:3.12
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      <<: *aws-local
      FAKE_SF_URL: http://fake-salesforce:8080
      # Short, so tests of a crashed batch don't wait long for redelivery. On
      # AWS it must be at least the worker's timeout (template.yaml).
      QUEUE_VISIBILITY_TIMEOUT: "10"
    volumes:
      - ./erp:/work/erp:ro
      - ./scripts:/work/scripts:ro
    working_dir: /work
    entrypoint: ["python3", "scripts/local_bootstrap.py"]
    restart: "no"

  # The ingest Lambda image, run under the Runtime Interface Emulator that ships
  # in the AWS base image. Invoke it like EventBridge Scheduler would:
  #   curl -s -d '{}' http://localhost:9001/2015-03-31/functions/function/invocations
  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    image: relay-ingest
    entrypoint: ["/usr/local/bin/aws-lambda-rie", "/var/task/main"]
    ports:
      - "127.0.0.1:9001:8080"
    environment:
      <<: *aws-local
      RELAY_PARAM_PREFIX: /relay
      QUEUE_NAME: relay-events
      INGEST_LAG_SECONDS: "120"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      fake-salesforce:
        condition: service_started

  # The sync worker Lambda image, under the Runtime Interface Emulator.
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: relay-worker
    ports:
      - "127.0.0.1:9002:8080"
    environment:
      <<: *aws-local
      RELAY_PARAM_PREFIX: /relay
      QUEUE_NAME: relay-events
      DLQ_NAME: relay-events-dlq
      BACKOFF_BASE_SECONDS: "1"
      BACKOFF_CAP_SECONDS: "900"
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  # The reconciler Lambda image. Invoke with {} or {"dry_run": true}.
  reconciler:
    build:
      context: .
      dockerfile: reconciler/Dockerfile
    image: relay-reconciler
    ports:
      - "127.0.0.1:9003:8080"
    environment:
      <<: *aws-local
      RELAY_PARAM_PREFIX: /relay
      QUEUE_NAME: relay-events
      RECONCILE_GRACE_MINUTES: "10"
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  # Test harness, not a product component: plays Lambda's SQS event source
  # mapping, which only exists on AWS (see tests/harness/esm_pump.py).
  esm-pump:
    image: public.ecr.aws/lambda/python:3.12
    entrypoint: ["python3", "-u", "/harness/esm_pump.py"]
    volumes:
      - ./tests/harness:/harness:ro
    ports:
      - "127.0.0.1:9100:9100"
    environment:
      <<: *aws-local
      QUEUE_NAME: relay-events
      FUNCTION_URL: http://worker:8080/2015-03-31/functions/function/invocations
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      worker:
        condition: service_started

  # ---- developer tools (profile "tools": never started by `up`) --------------
  # Go and golangci-lint without installing them:
  #   docker compose run --rm go go test ./...
  #   docker compose run --rm golangci-lint
  go:
    image: golang:1.27.1
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
    environment:
      CGO_ENABLED: "0"

  golangci-lint:
    image: golangci/golangci-lint:v2.13.2
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
    command: ["golangci-lint", "run", "./..."]

volumes:
  gomod:
  gocache:
